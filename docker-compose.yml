services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: healthpredict
      POSTGRES_USER: healthpredict
      POSTGRES_PASSWORD: healthpredict
    ports:
      - "5432:5432"
    volumes:
      - healthpredict_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthpredict"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthpredict_pg:

